services:
  postgres:
    image: postgres:16
    cpus: 2.0   # fixed resources so benchmark numbers are comparable (P15)
    environment:
      POSTGRES_DB: escrow
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: escrow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escrow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - escrow-network

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      # Host clients (app run from the IDE) must be told localhost, not kafka.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      # cp-kafka has no nc; ask the broker itself.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - escrow-network

  kafka-init:
    image: confluentinc/cp-kafka:7.8.0
    entrypoint: /bin/sh
    command: |
      -c '
      echo "Waiting for Kafka to be ready..."
      kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1
      
      echo "Creating topics..."
      kafka-topics --create --bootstrap-server kafka:29092 --topic escrow.milestone-events --partitions 3 --replication-factor 1 --if-not-exists
      kafka-topics --create --bootstrap-server kafka:29092 --topic escrow.milestone-events.DLT --partitions 1 --replication-factor 1 --if-not-exists
      
      kafka-topics --create --bootstrap-server kafka:29092 --topic escrow.payment-events --partitions 3 --replication-factor 1 --if-not-exists
      kafka-topics --create --bootstrap-server kafka:29092 --topic escrow.payment-events.DLT --partitions 1 --replication-factor 1 --if-not-exists
      
      kafka-topics --create --bootstrap-server kafka:29092 --topic ledger.entry-events --partitions 3 --replication-factor 1 --if-not-exists
      kafka-topics --create --bootstrap-server kafka:29092 --topic ledger.entry-events.DLT --partitions 1 --replication-factor 1 --if-not-exists
      
      echo "Topics created."
      '
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - escrow-network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - escrow-network

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.5.0
    ports:
      - "8474:8474"
      - "15432:15432"
      - "19090:19090"
    networks:
      - escrow-network
    command: >
      -config /config/toxiproxy.json
    volumes:
      - ./toxiproxy-config.json:/config/toxiproxy.json:ro
    depends_on:
      - postgres

  mock-payout-provider:
    build:
      context: .   # the Dockerfile copies mock-payout-provider/ and the parent pom.xml
      dockerfile: mock-payout-provider/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: escrow
      DB_PASSWORD: escrow
      SPRING_PROFILES_ACTIVE: ""
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - escrow-network
    profiles:
      - app

  escrow-service:
    build:
      context: .   # the Dockerfile copies escrow-service/ and the parent pom.xml
      dockerfile: escrow-service/Dockerfile
    cpus: 2.0      # fixed resources so benchmark numbers are comparable (P15)
    mem_limit: 1g
    environment:
      # ESCROW_DB lets load/run-bench.sh point each run at its own fresh database.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${ESCROW_DB:-escrow}
      SPRING_DATASOURCE_USERNAME: escrow
      SPRING_DATASOURCE_PASSWORD: escrow
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYOUT_PROVIDER_URL: http://mock-payout-provider:9090
      SPRING_PROFILES_ACTIVE: ""
      # Knobs for load/run-bench.sh (P15). Defaults match application.yml.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_POOL:-20}
      SPRING_THREADS_VIRTUAL_ENABLED: ${VIRTUAL_THREADS:-true}
      RATELIMIT_ENABLED: ${RATELIMIT_ENABLED:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - escrow-network
    profiles:
      - app

volumes:
  postgres_data:

networks:
  escrow-network:
    driver: bridge
