spring:
  application:
    name: escrow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 20
      # Keep Hikari's default auto-commit=true. @Transactional / TransactionTemplate switch it off per
      # transaction; with auto-commit=false globally, any write made outside a transaction is silently
      # rolled back when the connection returns to the pool (found by chaos C2, see chaos/FINDINGS.md).
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    schemas: public
  kafka:
    producer:
      acks: all
      # Kafka client settings Boot has no first-class property for must go under "properties".
      # "enable.idempotence: true" used to sit directly here, where Boot ignores it (it only held
      # because Kafka 3+ defaults to idempotence on). OutboxProducerConfigIT asserts the result.
      # Idempotence plus at most 5 in-flight requests keeps per-partition order across retries.
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: escrow-service
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # The relay publishes plain JSON envelopes without type headers, and listeners take JsonNode.
      # ErrorHandlingDeserializer keeps one undeserializable record from wedging the partition.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.fasterxml.jackson.databind.JsonNode
        spring.json.use.type.headers: false
        spring.json.trusted.packages: '*'
    listener:
      ack-mode: RECORD
      poll-timeout: 3000
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:   # Boot 3 reads spring.data.redis.*; the old spring.redis.* keys were ignored
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      jvm: true

escrow:
  fee-bps: 500
  default-review-window: P5D
  cancel-grace: P3D
  auto-release:
    poll-interval: 30s
    enabled: true
  # Bound by RateLimitConfig (prefix escrow.ratelimit). This block used to sit at the top level as
  # ratelimit.*, so nothing bound and every field defaulted to false/0: rate limiting was silently off.
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    default-limit: 30      # requests per minute for general money operations
    payout-limit: 5        # requests per minute for payout operations (stricter)
    window-seconds: 60     # duration of each rate limit window

payouts:
  provider-base-url: ${PAYOUT_PROVIDER_URL:http://localhost:9090}
  connect-timeout: 1s
  read-timeout: 2s

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

chaos:
  crash-point: NONE
