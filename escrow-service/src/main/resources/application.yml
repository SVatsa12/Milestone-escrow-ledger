spring:
  application:
    name: escrow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 20
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    schemas: public
  kafka:
    producer:
      acks: all
      enable.idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: escrow-service
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 1s

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      jvm: true

escrow:
  fee-bps: 500
  default-review-window: P5D
  cancel-grace: P3D
  auto-release:
    poll-interval: 30s
    enabled: true

payouts:
  provider-base-url: ${PAYOUT_PROVIDER_URL:http://localhost:9090}
  connect-timeout: 1s
  read-timeout: 2s

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

ratelimit:
  transfer-requests-per-minute: 30
  payout-requests-per-minute: 5

chaos:
  crash-point: NONE
