<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Top-Up - Milestone Escrow</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            transition: border-color 0.3s;
        }
        .input-wrapper:focus-within {
            border-color: #667eea;
            background: #f9f9ff;
        }
        .currency {
            padding: 12px 16px;
            color: #666;
            font-weight: 600;
            border-right: 1px solid #e0e0e0;
        }
        input[type="number"] {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 16px;
            font-size: 16px;
            outline: none;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        #proceedBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #proceedBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        #proceedBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #cancelBtn {
            background: #f0f0f0;
            color: #333;
        }
        #cancelBtn:hover {
            background: #e0e0e0;
        }
        .status-message {
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .status-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4caf50;
            display: block;
        }
        .status-message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
            display: block;
        }
        .status-message.pending {
            background: #fff3e0;
            color: #e65100;
            border: 1px solid #ff9800;
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .help-text {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wallet Top-Up</h1>
        <p class="subtitle">Add funds to your account via Razorpay</p>

        <form id="depositForm">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <div class="input-wrapper">
                    <span class="currency">₹</span>
                    <input type="number" id="amount" name="amount" min="1" step="1" placeholder="100" required>
                </div>
                <div class="help-text">Enter amount in rupees (e.g., 100 = ₹100.00)</div>
            </div>

            <div class="button-group">
                <button type="submit" id="proceedBtn">Proceed to Payment</button>
                <button type="button" id="cancelBtn" onclick="window.history.back()">Cancel</button>
            </div>

            <div class="status-message" id="statusMessage"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('depositForm');
        const amountInput = document.getElementById('amount');
        const proceedBtn = document.getElementById('proceedBtn');
        const statusMessage = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await initiateDeposit();
        });

        async function initiateDeposit() {
            const amountInRupees = parseInt(amountInput.value);
            if (!amountInRupees || amountInRupees < 1) {
                showError('Please enter a valid amount');
                return;
            }

            const amountPaise = amountInRupees * 100; // Convert to paise
            proceedBtn.disabled = true;
            proceedBtn.innerHTML = '<span class="spinner"></span>Initiating...';

            try {
                // Call backend to create deposit and get Razorpay order
                const response = await fetch('/api/v1/deposits', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Actor-Id': localStorage.getItem('userId') || '1',
                        'X-Actor-Role': 'CLIENT',
                        'Idempotency-Key': generateIdempotencyKey()
                    },
                    body: JSON.stringify({ amountPaise })
                });

                if (!response.ok) {
                    const error = await response.json();
                    showError(error.message || 'Failed to initiate deposit');
                    proceedBtn.disabled = false;
                    proceedBtn.textContent = 'Proceed to Payment';
                    return;
                }

                const deposit = await response.json();
                localStorage.setItem('depositId', deposit.depositId);

                // Open Razorpay Checkout
                openCheckout(deposit);
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Please try again.');
                proceedBtn.disabled = false;
                proceedBtn.textContent = 'Proceed to Payment';
            }
        }

        function openCheckout(deposit) {
            const options = {
                key: deposit.razorpayKeyId,
                amount: deposit.amountPaise,
                currency: 'INR',
                name: 'Milestone Escrow',
                description: `Wallet Top-Up`,
                order_id: deposit.razorpayOrderId,
                handler: function (response) {
                    handlePaymentSuccess(response);
                },
                prefill: {
                    name: 'User',
                    email: 'user@example.com'
                },
                theme: {
                    color: '#667eea'
                }
            };

            const razorpay = new Razorpay(options);
            razorpay.on('payment.failed', function (response) {
                handlePaymentFailure(response);
            });
            razorpay.open();
        }

        function handlePaymentSuccess(response) {
            // Payment successful at Razorpay, but funds not yet credited
            // Wallet will be credited only after webhook verification
            showPending('Payment received! Crediting shortly...');
            proceedBtn.disabled = true;
            proceedBtn.textContent = 'Proceed to Payment';

            // Poll the deposit status
            pollDepositStatus();
        }

        function handlePaymentFailure(response) {
            showError('Payment failed. Please try again.');
            proceedBtn.disabled = false;
            proceedBtn.textContent = 'Proceed to Payment';
        }

        function pollDepositStatus() {
            const depositId = localStorage.getItem('depositId');
            if (!depositId) return;

            const interval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/v1/deposits/${depositId}`);
                    if (!response.ok) return;

                    const deposit = await response.json();
                    if (deposit.status === 'CAPTURED') {
                        showSuccess('Wallet credited successfully! ✓');
                        clearInterval(interval);
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 2000);
                    } else if (deposit.status === 'FAILED' || deposit.status === 'AMOUNT_MISMATCH') {
                        showError('Deposit failed: ' + deposit.status);
                        clearInterval(interval);
                    }
                } catch (error) {
                    console.error('Poll error:', error);
                }
            }, 2000); // Poll every 2 seconds

            // Stop polling after 60 seconds
            setTimeout(() => clearInterval(interval), 60000);
        }

        function generateIdempotencyKey() {
            return 'dep_' + Math.random().toString(36).substring(2, 15) + Date.now();
        }

        function showSuccess(message) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message success';
        }

        function showError(message) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message error';
        }

        function showPending(message) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message pending';
        }
    </script>
</body>
</html>
