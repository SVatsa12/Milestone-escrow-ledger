spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/escrow
    username: escrow
    password: escrow
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
  redis:
    host: localhost
    port: 6379

escrow:
  auto-release:
    enabled: false
